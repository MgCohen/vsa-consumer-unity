# Makes sure that Assets/Plugins/VSA has the DLLs of the VsaVersion in Vendor/VsaVendor.csproj.
# The Unity tests need a Unity license, so they run on a dev machine (see README.md).
name: Vendor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Before
        run: sha1sum Assets/Plugins/VSA/VSA.Domain.dll Assets/Plugins/VSA/System.Memory.dll

      - name: Vendor
        run: dotnet run --file vendor.cs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: After
        run: |
          sha1sum Assets/Plugins/VSA/VSA.Domain.dll Assets/Plugins/VSA/System.Memory.dll
          sha1sum ~/.nuget/packages/vsa.domain/*/lib/netstandard2.1/VSA.Domain.dll
          ls ~/.nuget/packages/system.memory/
          find ~/.nuget/packages/system.memory -name System.Memory.dll | xargs sha1sum

      - name: Compare
        run: |
          git status --porcelain Assets/Plugins/VSA
          git diff --exit-code --stat Assets/Plugins/VSA
          test -z "$(git status --porcelain Assets/Plugins/VSA)"
